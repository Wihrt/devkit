# devkit · base — reusable workflow. GitHub only orchestrates; every job runs
# `mise run <task>`, exactly what you run locally.
#
#   jobs:
#     base:
#       uses: Wihrt/devkit/.github/workflows/base.yml@<version>
name: devkit-base

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory holding the project's mise.toml
        type: string
        default: "."
    secrets:
      git-token:
        description: Token able to read private repositories read by mise git includes (devkit fork, private task repos)
        required: false

permissions:
  contents: read

jobs:
  prek:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7
      # mise clones its git:: includes itself; github.token only reads this repository.
      - name: Credentials for private mise git includes
        env:
          GIT_TOKEN: ${{ secrets.git-token }}
        run: '[ -z "$GIT_TOKEN" ] || git config --global url."https://x-access-token:${GIT_TOKEN}@github.com/".insteadOf "https://github.com/"'
      - uses: jdx/mise-action@v5
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.17
          working_directory: ${{ inputs.working-directory }}
      - run: mise run lint:prek

  secrets:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # mise clones its git:: includes itself; github.token only reads this repository.
      - name: Credentials for private mise git includes
        env:
          GIT_TOKEN: ${{ secrets.git-token }}
        run: '[ -z "$GIT_TOKEN" ] || git config --global url."https://x-access-token:${GIT_TOKEN}@github.com/".insteadOf "https://github.com/"'
      - uses: jdx/mise-action@v5
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.17
          working_directory: ${{ inputs.working-directory }}
      - run: mise run lint:secrets

  actions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7
      # mise clones its git:: includes itself; github.token only reads this repository.
      - name: Credentials for private mise git includes
        env:
          GIT_TOKEN: ${{ secrets.git-token }}
        run: '[ -z "$GIT_TOKEN" ] || git config --global url."https://x-access-token:${GIT_TOKEN}@github.com/".insteadOf "https://github.com/"'
      - uses: jdx/mise-action@v5
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.17
          working_directory: ${{ inputs.working-directory }}
      - run: mise run lint:actions
